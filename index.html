<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Workout">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect fill='%230a0a0a' width='180' height='180'/><circle cx='90' cy='90' r='50' fill='%2300d9ff'/></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%230a0a0a' width='32' height='32'/><circle cx='16' cy='16' r='10' fill='%2300d9ff'/></svg>">
    <title>Workout</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0a;
            --bg-secondary: #1a1a1a;
            --bg-tertiary: #2a2a2a;
            --border: rgba(255, 255, 255, 0.05);
            --border-light: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-tertiary: #707070;
            --accent: #00d9ff;
            --accent-dark: #0099bb;
            --success: #00ff88;
            --danger: #ff3366;
            --warning: #ffaa00;
            --safe-area-inset-top: max(12px, env(safe-area-inset-top));
            --safe-area-inset-bottom: max(20px, env(safe-area-inset-bottom));
        }

        html, body {
            width: 100%;
            height: 100%;
            background:
                radial-gradient(circle at 12% -8%, rgba(0, 217, 255, 0.10), transparent 40%),
                radial-gradient(circle at 100% 8%, rgba(167, 139, 250, 0.07), transparent 35%),
                var(--bg-primary);
            background-attachment: fixed;
            color: var(--text-primary);
            font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        /* Scrolling */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Global transitions */
        * {
            transition: background-color 150ms ease, color 150ms ease, border-color 150ms ease;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            user-select: none;
        }

        input {
            font-family: inherit;
            -webkit-appearance: none;
            appearance: none;
        }

        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type=number] {
            -moz-appearance: textfield;
        }

        /* App container */
        .app-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .app-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding-top: var(--safe-area-inset-top);
            padding-bottom: var(--safe-area-inset-bottom);
        }

        .app-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: calc(60px + var(--safe-area-inset-bottom));
            padding-bottom: var(--safe-area-inset-bottom);
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.35);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-item {
            flex: 1;
            height: 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            border: none;
            background: none;
            color: var(--text-tertiary);
            font-size: 11px;
            font-weight: 500;
            padding: 0;
            cursor: pointer;
        }

        .nav-item.active {
            color: var(--accent);
        }

        .nav-item-icon {
            font-size: 24px;
            line-height: 1;
            transition: transform 200ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item.active .nav-item-icon {
            transform: scale(1.12);
        }

        /* Screens */
        .screen {
            display: none;
            animation: fadeIn 200ms ease;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(0, 217, 255, 0.25); }
            50% { box-shadow: 0 0 0 6px rgba(0, 217, 255, 0.08); }
        }

        /* Cards and containers */
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
        }

        .card-hover {
            transition: background-color 150ms ease, border-color 150ms ease, box-shadow 150ms ease, transform 150ms ease;
        }

        .card-hover:active {
            background: var(--bg-tertiary);
            border-color: var(--border-light);
            transform: scale(0.985);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 150ms ease;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .btn-primary:active {
            background: var(--accent-dark);
            transform: scale(0.98);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:active {
            background: var(--bg-primary);
            border-color: var(--text-secondary);
        }

        .btn-danger {
            background: rgba(255, 51, 102, 0.1);
            color: #ff3366;
            border: 1px solid rgba(255, 51, 102, 0.2);
        }

        .btn-danger:active {
            background: rgba(255, 51, 102, 0.2);
            border-color: rgba(255, 51, 102, 0.4);
        }

        .btn-outline-accent {
            background: rgba(0, 217, 255, 0.08);
            color: var(--accent);
            border: 1px solid rgba(0, 217, 255, 0.25);
        }

        .btn-outline-accent:active {
            background: rgba(0, 217, 255, 0.16);
            border-color: rgba(0, 217, 255, 0.4);
        }

        /* Top-of-screen back button. Explicit align-self/display keeps it
           pinned to the left edge and content-sized even when its parent is
           a flex column with the default stretch behavior — plain <button>
           elements center their own text once stretched, which otherwise
           makes "Back" drift toward the middle of the screen. */
        .back-btn {
            align-self: flex-start;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--accent);
            font-size: 16px;
            font-weight: 600;
            padding: 6px 10px 6px 2px;
            margin-bottom: 8px;
            margin-left: -2px;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
        }

        .back-btn:active {
            background: rgba(0, 217, 255, 0.08);
        }

        .btn-sm {
            padding: 8px 12px;
            font-size: 13px;
        }

        .btn-block {
            width: 100%;
        }

        /* Compact icon-only action buttons — used for frequent list-item
           actions (reorder, edit, duplicate, delete) so cards stay dense
           and scannable instead of being padded out with labeled buttons. */
        .icon-btn {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 0;
        }

        .icon-btn:active {
            background: var(--bg-primary);
            transform: scale(0.94);
        }

        .icon-btn:disabled {
            cursor: default;
        }

        .icon-btn.danger {
            color: var(--danger);
        }

        .icon-btn.danger:active {
            background: rgba(255, 51, 102, 0.12);
            border-color: rgba(255, 51, 102, 0.3);
        }

        .icon-toolbar {
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
        }

        .icon-toolbar-divider {
            width: 1px;
            height: 18px;
            background: var(--border-light);
            flex-shrink: 0;
            margin: 0 1px;
        }

        /* Typography */
        /* Type scale intentionally starts at h2 — on a phone screen 28px is
           already the largest heading anything needs, so there's no h1
           tier hanging around unused. */
        .text-h2 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .text-h3 {
            font-size: 22px;
            font-weight: 700;
        }

        .text-h4 {
            font-size: 18px;
            font-weight: 600;
        }

        .text-body {
            font-size: 15px;
            line-height: 1.5;
        }

        .text-caption {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* Layout utilities */
        .flex {
            display: flex;
        }

        .flex-col {
            flex-direction: column;
        }

        .gap-xs { gap: 4px; }
        .gap-sm { gap: 8px; }
        .gap-md { gap: 12px; }
        .gap-lg { gap: 16px; }
        .gap-xl { gap: 24px; }

        .px-md { padding-left: 16px; padding-right: 16px; }
        .py-md { padding-top: 16px; padding-bottom: 16px; }
        .p-md { padding: 16px; }

        .mt-md { margin-top: 16px; }
        .mb-md { margin-bottom: 16px; }
        .mt-lg { margin-top: 24px; }

        /* Screen specific styles */
        .home-screen {
            padding: 0 16px;
        }

        /* Deliberate one-off "hero" style for the Home greeting — same size
           as .text-h2 but light-weight and muted, so it reads as a quiet
           greeting rather than a section header competing with "Your Plans"
           right below it. Not part of the h2-h4 heading scale on purpose. */
        .greeting {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .greeting-time {
            color: var(--text-primary);
        }

        .plans-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 100px;
        }

        .plan-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(10px);
            cursor: pointer;
        }

        .plan-card-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
        }

        .plan-card-name {
            font-size: 18px;
            font-weight: 600;
            flex: 1;
            min-width: 0;
            word-break: break-word;
        }

        .plan-card-count {
            font-size: 13px;
            color: var(--text-secondary);
            flex-shrink: 0;
            white-space: nowrap;
        }

        .plan-card-status {
            display: inline-block;
            padding: 4px 8px;
            background: rgba(0, 217, 255, 0.1);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 4px;
            font-size: 11px;
            color: var(--accent);
            margin-top: 8px;
        }

        /* Input styles */
        .input-field {
            width: 100%;
            padding: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--accent);
            background: var(--bg-secondary);
        }

        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        /* Set recorder */
        .set-recorder {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .set-recorder-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .set-number {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .set-status {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: transparent;
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .set-status.completed {
            background: var(--success);
            border-color: var(--success);
            color: var(--bg-primary);
        }

        .set-inputs {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }

        /* Mobile-first: weight and reps stack full-width so each gets
           enough room for stepper buttons + a large readable number.
           They only sit side-by-side once there's real desktop width. */
        .set-input-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .set-input-full {
            width: 100%;
        }

        .set-input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-width: 0;
        }

        .set-input-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .set-input-value {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .set-input-value input {
            flex: 1;
            min-width: 0;
            padding: 12px 4px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            outline: none;
        }

        .set-input-value input:focus {
            border-color: var(--accent);
            background: var(--bg-primary);
        }

        .set-input-unit {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
            min-width: 26px;
            flex-shrink: 0;
        }

        .set-complete-btn {
            width: 100%;
            padding: 10px;
            background: var(--accent);
            color: var(--bg-primary);
            border: none;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .set-complete-btn:active {
            transform: scale(0.98);
        }

        .set-complete-btn.completed-pulse {
            animation: completePulse 320ms ease;
        }

        @keyframes completePulse {
            0% { transform: scale(1); }
            40% { transform: scale(0.96); }
            100% { transform: scale(1); }
        }

        /* Stepper buttons for fast numeric entry — sized to a comfortable
           thumb tap target since this is used almost exclusively on phones. */
        .stepper-btn {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 8px;
            font-size: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .stepper-btn:active {
            background: var(--bg-primary);
            transform: scale(0.95);
        }

        /* Set-completion dots shown per exercise */
        .set-dots {
            display: flex;
            gap: 5px;
            margin-top: 6px;
        }

        .set-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--border-light);
            transition: background-color 200ms ease, transform 200ms ease;
        }

        .set-dot.filled {
            background: var(--success);
        }

        /* Session progress bar */
        .session-progress-track {
            width: 100%;
            height: 4px;
            background: var(--border-light);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 10px;
        }

        .session-progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width 300ms ease;
        }

        /* Completion screen */
        .complete-checkmark {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(0, 255, 136, 0.12);
            border: 1px solid rgba(0, 255, 136, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: var(--success);
            margin: 0 auto;
            animation: completeAppear 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes completeAppear {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-row > span:first-child {
            flex: 1;
            min-width: 0;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
            font-feature-settings: "tnum";
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* Progress screen */
        .segmented-control {
            display: flex;
            gap: 6px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .segmented-btn {
            flex: 1;
            min-width: 0;
            padding: 9px 4px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            cursor: pointer;
        }

        .segmented-btn.active {
            background: var(--accent);
            color: var(--bg-primary);
        }

        .chart-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            height: 240px;
        }

        .suggestion-banner {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            background: rgba(0, 217, 255, 0.08);
            border: 1px solid rgba(0, 217, 255, 0.2);
            border-radius: 8px;
            padding: 10px 12px;
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.4;
            color: var(--accent);
        }

        /* Day-of-week picker (7 square pills, sized to fit any phone width) */
        .day-picker {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }

        .day-pill {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .day-pill.selected {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
        }

        .day-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 12px;
            color: var(--accent);
            font-weight: 500;
        }

        /* Calendar */
        .calendar-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .calendar-nav-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 5px;
        }

        .calendar-day-label {
            text-align: center;
            font-size: 11px;
            color: var(--text-tertiary);
            padding-bottom: 6px;
            font-weight: 600;
        }

        .calendar-cell {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 3px;
            border-radius: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
        }

        .calendar-cell.empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }

        .calendar-cell.today {
            border-color: var(--accent);
        }

        .calendar-cell.has-session {
            background: rgba(0, 217, 255, 0.08);
        }

        .calendar-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }

        .calendar-dot.scheduled-only {
            background: transparent;
            border: 1.5px solid var(--text-tertiary);
        }

        .resume-card-glow {
            animation: glowPulse 2.4s ease-in-out infinite;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: flex-end;
            z-index: 200;
            animation: fadeIn 200ms ease;
        }

        .modal-content {
            background: var(--bg-secondary);
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 24px 16px;
            padding-bottom: calc(24px + var(--safe-area-inset-bottom));
            border: 1px solid var(--border);
            border-bottom: none;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 200ms ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 700;
        }

        .modal-close-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* In-app confirm dialog — replaces window.confirm() so destructive
           and blocking prompts stay inside the app's own dark UI instead of
           breaking out to a native OS alert. Centered, rounded on every
           corner (unlike the bottom-sheet .modal-content), sized like a
           compact alert rather than a full sheet. */
        .confirm-overlay {
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .confirm-modal-content {
            width: 100%;
            max-width: 340px;
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 24px 20px;
            text-align: center;
            animation: slideUp 200ms ease;
        }

        .confirm-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 217, 255, 0.1);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .confirm-icon.danger {
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger);
        }

        .confirm-message {
            color: var(--text-secondary);
            margin-bottom: 22px;
            white-space: pre-line;
        }

        /* Responsive */
        @media (min-width: 768px) {
            .app-nav {
                flex-direction: row;
                gap: 0;
            }

            .modal-content {
                width: 600px;
                margin: auto;
                border-radius: 24px;
                border-bottom: 1px solid var(--border);
                max-height: 80vh;
            }

            .set-recorder {
                margin-bottom: 16px;
            }

            .set-input-row {
                flex-direction: row;
            }

            .set-input-row .set-input-group {
                flex: 1;
            }
        }

        /* Empty state */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 60px 20px;
            text-align: center;
        }

        .empty-state-icon {
            font-size: 48px;
            opacity: 0.3;
        }

        .empty-state-text {
            color: var(--text-secondary);
            max-width: 280px;
        }

        /* Loading */
        .spinner {
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 600ms linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Padding bottom for nav */
        .with-nav-bottom {
            padding-bottom: 100px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback, useMemo } = React;

        // ==================== Types & Constants ====================

        const EXERCISE_TYPES = {
            WEIGHTED: 'weighted',
            BODYWEIGHT: 'bodyweight',
            TIME_BASED: 'time_based'
        };

        function generateId() {
            if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                return crypto.randomUUID();
            }
            return Date.now().toString(36) + Math.random().toString(36).slice(2);
        }

        // Days follow JS's native Date.getDay() convention: 0 = Sunday.
        const WEEKDAY_LETTERS = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
        const WEEKDAY_SHORT = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

        // A small, muted palette (distinct from the primary cyan accent used
        // for actions everywhere) so different plans get a visual identity
        // without needing a color picker UI. Deterministic per plan id.
        const PLAN_COLORS = ['#00d9ff', '#a78bfa', '#34d399', '#fb923c', '#f472b6', '#60a5fa'];

        function getPlanColor(planId) {
            if (!planId) return PLAN_COLORS[0];
            let hash = 0;
            for (let i = 0; i < planId.length; i++) {
                hash = (hash * 31 + planId.charCodeAt(i)) >>> 0;
            }
            return PLAN_COLORS[hash % PLAN_COLORS.length];
        }

        // Small line-style icon set (SF Symbols-inspired) used inside
        // .icon-btn controls, keeping list-item actions compact instead of
        // relying on text labels or emoji glyphs.
        function IconChevronUp({ size = 16 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M18 15l-6-6-6 6" />
                </svg>
            );
        }

        function IconChevronDown({ size = 16 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M6 9l6 6 6-6" />
                </svg>
            );
        }

        function IconPencil({ size = 16 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M12 20h9" />
                    <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                </svg>
            );
        }

        function IconTrash({ size = 16 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 6h18" />
                    <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                    <path d="M10 11v6" />
                    <path d="M14 11v6" />
                </svg>
            );
        }

        function IconCopy({ size = 16 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="9" y="9" width="12" height="12" rx="2" />
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
                </svg>
            );
        }

        function IconChevronLeft({ size = 18 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.25" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            );
        }

        // Bottom-nav icons. Kept as line-style SVGs (not emoji) so the tab
        // bar — the one piece of UI visible on every single screen — uses
        // the same icon language as the rest of the app instead of mixing
        // platform emoji glyphs with custom icons.
        function IconHome({ size = 23 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M3 11.5L12 4l9 7.5" />
                    <path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9" />
                </svg>
            );
        }

        function IconChartLine({ size = 23 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M4 19V5" />
                    <path d="M4 19h16" />
                    <path d="M7.5 15.5l3.5-4 3 2.5 4.5-6" />
                </svg>
            );
        }

        function IconClipboardList({ size = 23 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="5" y="4" width="14" height="17" rx="2" />
                    <path d="M9 3.5h6a1 1 0 0 1 1 1V6H8V4.5a1 1 0 0 1 1-1z" />
                    <path d="M8.5 11h7" />
                    <path d="M8.5 14.5h7" />
                    <path d="M8.5 18h4.5" />
                </svg>
            );
        }

        function IconTimer({ size = 23 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="13" r="8" />
                    <path d="M12 9v4l3 2" />
                    <path d="M9.5 2.5h5" />
                    <path d="M19 5l1.5-1.5" />
                </svg>
            );
        }

        // Standard top-of-screen back control. Always left-pinned and
        // content-sized (see .back-btn), regardless of whether its parent
        // happens to be a flex column.
        function BackButton({ onClick, label = 'Back' }) {
            return (
                <button className="back-btn" onClick={onClick}>
                    <IconChevronLeft size={17} />
                    {label}
                </button>
            );
        }

        function IconAlertCircle({ size = 22 }) {
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <circle cx="12" cy="12" r="9" />
                    <path d="M12 7.5v5.5" />
                    <path d="M12 16.2h.01" />
                </svg>
            );
        }

        // Single global confirm dialog, rendered once at the App root and
        // driven by confirmDialog.request(). Any screen can
        // `await confirmDialog.request({...})` instead of window.confirm().
        function GlobalConfirmModal() {
            const pending = useConfirmDialog();
            if (!pending) return null;

            return (
                <div className="modal-overlay confirm-overlay">
                    <div className="modal-content confirm-modal-content">
                        <div className={`confirm-icon ${pending.danger ? 'danger' : ''}`}>
                            {pending.danger ? <IconTrash size={22} /> : <IconAlertCircle size={22} />}
                        </div>
                        <div className="text-h4" style={{ marginBottom: '8px' }}>{pending.title}</div>
                        <div className="text-body confirm-message">{pending.message}</div>
                        <div style={{ display: 'flex', gap: '10px' }}>
                            <button className="btn btn-secondary btn-block" onClick={() => confirmDialog.resolve(false)}>
                                {pending.cancelLabel}
                            </button>
                            <button
                                className={`btn ${pending.danger ? 'btn-danger' : 'btn-primary'} btn-block`}
                                onClick={() => confirmDialog.resolve(true)}
                            >
                                {pending.confirmLabel}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        // Finds every workout across all plans scheduled for today's weekday.
        function formatScheduledDays(days) {
            if (!days || days.length === 0) return null;
            return [...days].sort().map(d => WEEKDAY_SHORT[d]).join(', ');
        }

        function getTodaysScheduledWorkouts(plans, sessions = []) {
            const todayIndex = new Date().getDay();
            const now = new Date();
            const doneWorkoutIdsToday = new Set(
                sessions
                    .filter(s => {
                        const d = new Date(s.completedAt);
                        return d.getFullYear() === now.getFullYear() &&
                            d.getMonth() === now.getMonth() &&
                            d.getDate() === now.getDate();
                    })
                    .map(s => s.workoutId)
            );
            const matches = [];
            plans.forEach(plan => {
                plan.workouts.forEach(workout => {
                    if ((workout.scheduledDays || []).includes(todayIndex) && !doneWorkoutIdsToday.has(workout.id)) {
                        matches.push({ planId: plan.id, planName: plan.name, workout });
                    }
                });
            });
            return matches;
        }

        function DayOfWeekPicker({ selectedDays, onToggle }) {
            return (
                <div className="day-picker">
                    {WEEKDAY_LETTERS.map((letter, day) => (
                        <button
                            key={day}
                            className={`day-pill ${selectedDays.includes(day) ? 'selected' : ''}`}
                            onClick={() => onToggle(day)}
                            title={WEEKDAY_SHORT[day]}
                        >
                            {letter}
                        </button>
                    ))}
                </div>
            );
        }

        // Returns the adjacent exercise sharing the same supersetId, if any.
        // Supersets are only ever formed between immediate neighbors, so this
        // is enough to find a pairing without needing a full grouping pass.
        function getSupersetPartner(exercises, exercise) {
            if (!exercise.supersetId) return null;
            const idx = exercises.findIndex(e => e.id === exercise.id);
            const prev = exercises[idx - 1];
            const next = exercises[idx + 1];
            if (prev && prev.supersetId === exercise.supersetId) return prev;
            if (next && next.supersetId === exercise.supersetId) return next;
            return null;
        }

        // Simple progression suggestion: looks at the most recent past
        // session that included this weighted exercise. If every completed
        // set hit (or beat) the target reps, suggest a small bump; otherwise
        // suggest repeating the same weight. Deliberately simple — no
        // plateau detection, no deload logic.
        function getSuggestedWeight(pastSessions, exerciseName, targetReps) {
            const sorted = [...pastSessions].sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
            for (const s of sorted) {
                const ex = s.exercises.find(e => e.name === exerciseName && e.type === 'weighted');
                if (!ex) continue;
                const completed = ex.completedSets.filter(set => set.completed && set.weight != null && set.reps != null);
                if (completed.length === 0) continue;

                const maxWeight = Math.max(...completed.map(set => set.weight));
                const allMetTarget = completed.every(set => set.reps >= (targetReps || 0));

                if (allMetTarget) {
                    const bumped = Math.round((maxWeight + 2.5) * 2) / 2;
                    return { weight: bumped, reason: 'You hit your reps last time — try a little more.' };
                }
                return { weight: maxWeight, reason: 'Repeat this weight and aim for your target reps.' };
            }
            return null;
        }

        // Downloads a timestamped JSON snapshot of all app data. Triggered
        // manually via the "Export backup" button on the Home screen.
        function downloadBackupFile() {
            try {
                const json = store.exportData();
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
                a.href = url;
                a.download = `workout-backup-${stamp}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error('Auto-backup failed:', e);
            }
        }

        // ==================== State Management (Zustand-like) ====================

        class WorkoutStore {
            constructor() {
                this.data = {
                    plans: [],
                    sessions: [],
                    currentSession: null
                };
                this.listeners = [];
                this.loadFromStorage();
                this.migrateDuplicateIds();
            }

            // One-time repair for data created before IDs were guaranteed unique.
            // Older versions generated IDs from Date.now() inside tight loops, so
            // several exercises/workouts created in the same plan could end up
            // sharing an identical ID. That made "delete one" remove every item
            // with that ID. This walks existing data and reassigns fresh IDs to
            // any duplicates found (keeping the first occurrence untouched).
            migrateDuplicateIds() {
                let changed = false;
                const seenPlanIds = new Set();

                this.data.plans.forEach(plan => {
                    if (seenPlanIds.has(plan.id)) {
                        plan.id = generateId();
                        changed = true;
                    }
                    seenPlanIds.add(plan.id);

                    const seenWorkoutIds = new Set();
                    (plan.workouts || []).forEach(workout => {
                        if (seenWorkoutIds.has(workout.id)) {
                            workout.id = generateId();
                            changed = true;
                        }
                        seenWorkoutIds.add(workout.id);

                        const seenExerciseIds = new Set();
                        (workout.exercises || []).forEach(exercise => {
                            if (seenExerciseIds.has(exercise.id)) {
                                exercise.id = generateId();
                                changed = true;
                            }
                            seenExerciseIds.add(exercise.id);
                        });
                    });
                });

                // Also repair an in-progress session, if any — it's still mutable,
                // unlike completed history which must stay an untouched snapshot.
                if (this.data.currentSession) {
                    const seenIds = new Set();
                    this.data.currentSession.exercises.forEach(exercise => {
                        if (seenIds.has(exercise.id)) {
                            exercise.id = generateId();
                            changed = true;
                        }
                        seenIds.add(exercise.id);
                    });
                }

                if (changed) {
                    console.warn('Workout data had duplicate IDs from an earlier version — repaired automatically.');
                    this.saveToStorage();
                }
            }

            subscribe(listener) {
                this.listeners.push(listener);
                return () => {
                    this.listeners = this.listeners.filter(l => l !== listener);
                };
            }

            notify() {
                this.listeners.forEach(l => l());
                this.saveToStorage();
            }

            // Plans
            getPlans() {
                return this.data.plans;
            }

            getPlan(id) {
                return this.data.plans.find(p => p.id === id);
            }

            createPlan(name) {
                const plan = {
                    id: generateId(),
                    name,
                    workouts: [],
                    createdAt: new Date().toISOString()
                };
                this.data.plans.push(plan);
                this.notify();
                return plan;
            }

            updatePlan(id, updates) {
                const plan = this.getPlan(id);
                if (plan) {
                    Object.assign(plan, updates);
                    this.notify();
                }
            }

            deletePlan(id) {
                const index = this.data.plans.findIndex(p => p.id === id);
                if (index !== -1) {
                    this.data.plans.splice(index, 1);
                    this.notify();
                }
            }

            // Workouts
            addWorkout(planId, name) {
                const plan = this.getPlan(planId);
                if (plan) {
                    const workout = {
                        id: generateId(),
                        name,
                        exercises: []
                    };
                    plan.workouts.push(workout);
                    this.notify();
                    return workout;
                }
            }

            reorderWorkouts(planId, workouts) {
                const plan = this.getPlan(planId);
                if (plan) {
                    plan.workouts = workouts;
                    this.notify();
                }
            }

            duplicateWorkout(planId, workoutId) {
                const plan = this.getPlan(planId);
                const workout = this.getWorkout(planId, workoutId);
                if (!plan || !workout) return null;

                const index = plan.workouts.findIndex(w => w.id === workoutId);
                const copy = {
                    ...workout,
                    id: generateId(),
                    name: `${workout.name} (Copy)`,
                    // Deliberately unscheduled — otherwise the copy would
                    // immediately fire alongside the original on the same
                    // weekday(s) until the user notices and edits it.
                    scheduledDays: [],
                    exercises: workout.exercises.map(ex => ({
                        ...ex,
                        id: generateId()
                    }))
                };
                plan.workouts.splice(index + 1, 0, copy);
                this.notify();
                return copy;
            }

            getWorkout(planId, workoutId) {
                const plan = this.getPlan(planId);
                return plan?.workouts.find(w => w.id === workoutId);
            }

            updateWorkout(planId, workoutId, updates) {
                const workout = this.getWorkout(planId, workoutId);
                if (workout) {
                    Object.assign(workout, updates);
                    this.notify();
                }
            }

            deleteWorkout(planId, workoutId) {
                const plan = this.getPlan(planId);
                if (plan) {
                    const index = plan.workouts.findIndex(w => w.id === workoutId);
                    if (index !== -1) {
                        plan.workouts.splice(index, 1);
                        this.notify();
                    }
                }
            }

            // Exercises
            addExercise(planId, workoutId, exercise) {
                const workout = this.getWorkout(planId, workoutId);
                if (workout) {
                    exercise.id = generateId();
                    workout.exercises.push(exercise);
                    this.notify();
                    return exercise;
                }
            }

            updateExercise(planId, workoutId, exerciseId, updates) {
                const workout = this.getWorkout(planId, workoutId);
                const exercise = workout?.exercises.find(e => e.id === exerciseId);
                if (exercise) {
                    Object.assign(exercise, updates);
                    this.notify();
                }
            }

            deleteExercise(planId, workoutId, exerciseId) {
                const workout = this.getWorkout(planId, workoutId);
                if (workout) {
                    const index = workout.exercises.findIndex(e => e.id === exerciseId);
                    if (index !== -1) {
                        workout.exercises.splice(index, 1);
                        this.repairSupersetAdjacency(workout);
                        this.notify();
                    }
                }
            }

            reorderExercises(planId, workoutId, exercises) {
                const workout = this.getWorkout(planId, workoutId);
                if (workout) {
                    workout.exercises = exercises;
                    this.repairSupersetAdjacency(workout);
                    this.notify();
                }
            }

            // Supersets are only valid between immediate neighbors. If a
            // reorder or a deletion leaves a linked exercise without its
            // partner directly beside it, the link is dropped automatically
            // rather than leaving a dangling/confusing half-superset.
            repairSupersetAdjacency(workout) {
                workout.exercises.forEach((ex, i) => {
                    if (!ex.supersetId) return;
                    const prev = workout.exercises[i - 1];
                    const next = workout.exercises[i + 1];
                    const hasPartner = (prev && prev.supersetId === ex.supersetId) ||
                        (next && next.supersetId === ex.supersetId);
                    if (!hasPartner) ex.supersetId = null;
                });
            }

            linkSupersetWithNext(planId, workoutId, exerciseId) {
                const workout = this.getWorkout(planId, workoutId);
                if (!workout) return;
                const idx = workout.exercises.findIndex(e => e.id === exerciseId);
                if (idx === -1 || idx === workout.exercises.length - 1) return;
                const a = workout.exercises[idx];
                const b = workout.exercises[idx + 1];
                const groupId = generateId();
                a.supersetId = groupId;
                b.supersetId = groupId;
                this.notify();
            }

            unlinkSuperset(planId, workoutId, exerciseId) {
                const workout = this.getWorkout(planId, workoutId);
                if (!workout) return;
                const exercise = workout.exercises.find(e => e.id === exerciseId);
                if (!exercise || !exercise.supersetId) return;
                const groupId = exercise.supersetId;
                workout.exercises.forEach(e => {
                    if (e.supersetId === groupId) e.supersetId = null;
                });
                this.notify();
            }

            // Sessions (Workouts in progress)
            startWorkout(planId, workoutId) {
                const plan = this.getPlan(planId);
                const workout = this.getWorkout(planId, workoutId);

                if (!plan || !workout) return null;

                // Create session with snapshot of current plan
                const session = {
                    id: generateId(),
                    planId,
                    planName: plan.name,
                    workoutId,
                    workoutName: workout.name,
                    startedAt: new Date().toISOString(),
                    exercises: workout.exercises.map(ex => {
                        const setCount = Number.isInteger(ex.sets) && ex.sets > 0 ? ex.sets : 1;
                        return {
                            ...ex,
                            completedSets: Array(setCount).fill(null).map(() => ({
                                weight: null,
                                reps: null,
                                duration: null,
                                completed: false
                            }))
                        };
                    }),
                    inProgress: true
                };

                this.data.currentSession = session;
                this.notify();
                return session;
            }

            // Logs a workout as done today without going through the
            // set-by-set session flow — for workouts with no exercises to
            // track (e.g. Yoga) or when you just want a quick check-in.
            // Does not touch currentSession, so it never conflicts with an
            // actual in-progress workout.
            logWorkoutDone(planId, workoutId) {
                const plan = this.getPlan(planId);
                const workout = this.getWorkout(planId, workoutId);
                if (!plan || !workout) return null;

                const now = new Date().toISOString();
                const session = {
                    id: generateId(),
                    planId,
                    planName: plan.name,
                    workoutId,
                    workoutName: workout.name,
                    startedAt: now,
                    completedAt: now,
                    inProgress: false,
                    exercises: workout.exercises.map(ex => {
                        const setCount = Number.isInteger(ex.sets) && ex.sets > 0 ? ex.sets : 1;
                        return {
                            ...ex,
                            completedSets: Array(setCount).fill(null).map(() => ({
                                weight: null,
                                reps: null,
                                duration: null,
                                completed: false
                            }))
                        };
                    })
                };

                this.data.sessions.push(session);
                this.notify();
                return session;
            }

            getCurrentSession() {
                return this.data.currentSession;
            }

            updateSessionExercise(exerciseIndex, setIndex, values) {
                if (!this.data.currentSession) return;
                const exercise = this.data.currentSession.exercises[exerciseIndex];
                if (exercise && exercise.completedSets[setIndex]) {
                    exercise.completedSets[setIndex] = {
                        ...exercise.completedSets[setIndex],
                        ...values,
                        completed: true
                    };
                    this.notify();
                }
            }

            completeSession() {
                if (!this.data.currentSession) return;

                const session = {
                    ...this.data.currentSession,
                    inProgress: false,
                    completedAt: new Date().toISOString()
                };

                this.data.sessions.push(session);
                this.data.currentSession = null;
                this.notify();
                return session;
            }

            // Discards the in-progress workout entirely without saving it
            // to history — for when a workout was started by mistake or the
            // user just doesn't want to finish it at all (distinct from
            // "Pause & Resume Later", which keeps it around as-is).
            abandonSession() {
                this.data.currentSession = null;
                this.notify();
            }

            getSessions() {
                return [...this.data.sessions].sort((a, b) =>
                    new Date(b.completedAt) - new Date(a.completedAt)
                );
            }

            getSession(id) {
                return this.data.sessions.find(s => s.id === id);
            }

            deleteSession(id) {
                const index = this.data.sessions.findIndex(s => s.id === id);
                if (index !== -1) {
                    this.data.sessions.splice(index, 1);
                    this.notify();
                }
            }

            // Backup / restore
            exportData() {
                return JSON.stringify(this.data, null, 2);
            }

            importData(jsonString) {
                const parsed = JSON.parse(jsonString);
                if (!parsed || !Array.isArray(parsed.plans) || !Array.isArray(parsed.sessions)) {
                    throw new Error('This file does not look like a valid workout backup.');
                }
                this.data = {
                    plans: parsed.plans,
                    sessions: parsed.sessions,
                    currentSession: parsed.currentSession || null
                };
                this.normalizeData();
                this.notify();
            }

            // Defensive shape repair. Guards against a corrupted/partial
            // localStorage value (e.g. a failed write, or a hand-edited
            // backup file) crashing the whole app on startup — every screen
            // assumes plans/workouts/exercises/sessions are always arrays.
            normalizeData() {
                if (!this.data || typeof this.data !== 'object') {
                    this.data = { plans: [], sessions: [], currentSession: null };
                    return;
                }
                if (!Array.isArray(this.data.plans)) this.data.plans = [];
                if (!Array.isArray(this.data.sessions)) this.data.sessions = [];
                if (this.data.currentSession === undefined) this.data.currentSession = null;

                this.data.plans.forEach(plan => {
                    if (!Array.isArray(plan.workouts)) plan.workouts = [];
                    plan.workouts.forEach(workout => {
                        if (!Array.isArray(workout.exercises)) workout.exercises = [];
                    });
                });
            }

            // Persistence
            saveToStorage() {
                try {
                    localStorage.setItem('workout_app_state', JSON.stringify(this.data));
                } catch (e) {
                    console.error('Failed to save to storage:', e);
                }
            }

            loadFromStorage() {
                try {
                    const stored = localStorage.getItem('workout_app_state');
                    if (stored) {
                        this.data = JSON.parse(stored);
                    }
                } catch (e) {
                    console.error('Failed to load from storage:', e);
                }
                this.normalizeData();
            }
        }

        const store = new WorkoutStore();

        // Same subscribe/notify pattern as WorkoutStore, but for a single
        // pending confirm request instead of app data. Lets any handler
        // anywhere `await confirmDialog.request({...})` instead of calling
        // the native window.confirm(), which breaks out of the app's own
        // dark UI with a plain OS dialog.
        class ConfirmDialogController {
            constructor() {
                this.listeners = [];
                this.pending = null;
            }

            subscribe(listener) {
                this.listeners.push(listener);
                return () => {
                    this.listeners = this.listeners.filter(l => l !== listener);
                };
            }

            notify() {
                this.listeners.forEach(l => l());
            }

            request({ title = 'Are you sure?', message = '', confirmLabel = 'Confirm', cancelLabel = 'Cancel', danger = false }) {
                // Guard against a second request landing before the first
                // resolves (e.g. a fast double-tap firing two confirms back
                // to back) — without this, the new one would silently
                // overwrite `pending` and the first caller's promise would
                // never resolve, leaving that `await` hanging forever.
                if (this.pending) {
                    this.resolve(false);
                }
                return new Promise(resolve => {
                    this.pending = { title, message, confirmLabel, cancelLabel, danger, resolve };
                    this.notify();
                });
            }

            resolve(value) {
                if (!this.pending) return;
                const { resolve: resolveFn } = this.pending;
                this.pending = null;
                this.notify();
                resolveFn(value);
            }
        }

            }, []);

            return state;
        }

        function useConfirmDialog() {
            const [pending, setPending] = useState(confirmDialog.pending);

            useEffect(() => {
                const unsubscribe = confirmDialog.subscribe(() => {
                    setPending(confirmDialog.pending);
                });
                return unsubscribe;
            }, []);

            return pending;
        }

            const weekStats = (() => {
                const now = new Date();
                const day = (now.getDay() + 6) % 7; // 0 = Monday
                const monday = new Date(now);
                monday.setDate(now.getDate() - day);
                monday.setHours(0, 0, 0, 0);
                const sunday = new Date(monday);
                sunday.setDate(monday.getDate() + 7);

                const doneThisWeek = state.sessions.filter(s => {
                    const d = new Date(s.completedAt);
                    return d >= monday && d < sunday;
                }).length;

                const scheduledThisWeek = plans.reduce(
                    (sum, plan) => sum + plan.workouts.reduce((s, w) => s + (w.scheduledDays?.length || 0), 0),

            // because today hasn't been logged yet — only counts today as a
            // gap once the day is actually over (i.e. once "yesterday" too

            const currentStreak = (() => {
                const dayKey = (d) => `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                const loggedDays = new Set(state.sessions.map(s => dayKey(new Date(s.completedAt))));

                const cursor = new Date();
                cursor.setHours(0, 0, 0, 0);
                if (!loggedDays.has(dayKey(cursor))) {
                    cursor.setDate(cursor.getDate() - 1);
                }

                let streak = 0;
                while (loggedDays.has(dayKey(cursor))) {
                    streak += 1;
                    cursor.setDate(cursor.getDate() - 1);

        function useElapsedTime(startedAt) {
            const [elapsed, setElapsed] = useState('0:00');

            useEffect(() => {
                const start = new Date(startedAt).getTime();
                const tick = () => {
                    const secs = Math.max(0, Math.floor((Date.now() - start) / 1000));
                    const h = Math.floor(secs / 3600);
                    const m = Math.floor((secs % 3600) / 60);
                    const s = secs % 60;
                    const mm = h > 0 ? String(m).padStart(2, '0') : m;
                    const ss = String(s).padStart(2, '0');
                    setElapsed(h > 0 ? `${h}:${mm}:${ss}` : `${mm}:${ss}`);
                };
                tick();
                const interval = setInterval(tick, 1000);
                return () => clearInterval(interval);
            }, [startedAt]);

            return elapsed;
        }

                            onClick={handleDiscardWorkout}
