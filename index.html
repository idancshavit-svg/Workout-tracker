                            style={{ background: 'none', border: 'none', color: 'var(--danger)', cursor: 'pointer', padding: '4px', alignSelf: 'center' }}
                        >
                            Discard Workout
                        </button>
                    </div>
                </div>
            );
        }

        function ExerciseSetRecorder({ exercise, allExercises, exerciseIndex, onCompleteSet, pastSessions }) {
            const targetText = (() => {
                if (exercise.type === 'weighted') {
                    return `Target: ${exercise.sets} × ${exercise.reps} @ ${exercise.weight}kg`;
                }
                if (exercise.type === 'bodyweight') {
                    return `Target: ${exercise.sets} × ${exercise.reps} reps`;
                }
                return `Target: ${exercise.sets} × ${exercise.duration}s`;
            })();

            const partner = allExercises ? getSupersetPartner(allExercises, exercise) : null;

            const anyCompleted = exercise.completedSets.some(s => s.completed);
            const suggestion = (!anyCompleted && exercise.type === 'weighted' && pastSessions)
                ? getSuggestedWeight(pastSessions, exercise.name, exercise.reps)
                : null;

            return (
                <div style={exercise.supersetId ? { borderLeft: '3px solid var(--accent)', paddingLeft: '10px' } : undefined}>
                    <div style={{ marginBottom: '12px' }}>
                        {partner && (
                            <div className="text-caption" style={{ color: 'var(--accent)', fontWeight: 600, marginBottom: '4px' }}>
                                🔗 SUPERSET — then {partner.name}
                            </div>
                        )}
                        <div className="text-h4">{exercise.name}</div>
                        <div className="text-caption" style={{ marginTop: '4px' }}>
                            {targetText}
                        </div>
                        <div className="set-dots">
                            {exercise.completedSets.map((set, i) => (
                                <div key={i} className={`set-dot ${set.completed ? 'filled' : ''}`}></div>
                            ))}
                        </div>
                        {suggestion && (
                            <div className="suggestion-banner">
                                <span style={{ flexShrink: 0 }}>💡</span>
                                <span style={{ flex: 1, minWidth: 0 }}>Suggested: {suggestion.weight}kg — {suggestion.reason}</span>
                            </div>
                        )}
                    </div>

                    {exercise.completedSets.map((set, setIndex) => (
                        <SetInputCard
                            key={setIndex}
                            setNumber={setIndex + 1}
                            set={set}
                            exercise={exercise}
                            exerciseIndex={exerciseIndex}
                            setIndex={setIndex}
                            onComplete={onCompleteSet}
                        />
                    ))}
                </div>
            );
        }

        function SetInputCard({ setNumber, set, exercise, exerciseIndex, setIndex, onComplete }) {
            const [weight, setWeight] = useState(set.weight?.toString() || exercise.weight?.toString() || '');
            const [reps, setReps] = useState(set.reps?.toString() || exercise.reps?.toString() || '');
            const [duration, setDuration] = useState(set.duration?.toString() || exercise.duration?.toString() || '');
            const [pulsing, setPulsing] = useState(false);

            const step = (setter, current, delta, min = 0) => {
                const num = parseFloat(current) || 0;
                const next = Math.max(min, num + delta);
                setter(next % 1 === 0 ? next.toString() : next.toFixed(1));
            };

            const handleComplete = () => {
                const values = {
                    weight: weight ? parseFloat(weight) : null,
                    reps: reps ? parseInt(reps) : null,
                    duration: duration ? parseInt(duration) : null
                };
                onComplete(exerciseIndex, setIndex, values);
                setPulsing(true);
                setTimeout(() => setPulsing(false), 320);

                if (navigator.vibrate) {
                    navigator.vibrate(10);
                }
            };

            const isCompleted = set.completed;

            return (
                <div className="set-recorder">
                    <div className="set-recorder-header">
                        <div className="set-number">Set {setNumber}</div>
                        <div className={`set-status ${isCompleted ? 'completed' : ''}`}>
                            {isCompleted ? '✓' : ''}
                        </div>
                    </div>

                    <div className="set-inputs">
                        {exercise.type === 'weighted' && (
                            <div className="set-input-row">
                                <div className="set-input-group">
                                    <label className="set-input-label">Weight</label>
                                    <div className="set-input-value">
                                        <button className="stepper-btn" onClick={() => step(setWeight, weight, -2.5)}>−</button>
                                        <input
                                            type="number"
                                            step="0.5"
                                            value={weight}
                                            onChange={(e) => setWeight(e.target.value)}
                                            placeholder="0"
                                        />
                                        <button className="stepper-btn" onClick={() => step(setWeight, weight, 2.5)}>+</button>
                                        <span className="set-input-unit">kg</span>
                                    </div>
                                </div>
                                <div className="set-input-group">
                                    <label className="set-input-label">Reps</label>
                                    <div className="set-input-value">
                                        <button className="stepper-btn" onClick={() => step(setReps, reps, -1)}>−</button>
                                        <input
                                            type="number"
                                            value={reps}
                                            onChange={(e) => setReps(e.target.value)}
                                            placeholder="0"
                                        />
                                        <button className="stepper-btn" onClick={() => step(setReps, reps, 1)}>+</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {exercise.type === 'bodyweight' && (
                            <div className="set-input-group">
                                <label className="set-input-label">Reps</label>
                                <div className="set-input-value">
                                    <button className="stepper-btn" onClick={() => step(setReps, reps, -1)}>−</button>
                                    <input
                                        type="number"
                                        value={reps}
                                        onChange={(e) => setReps(e.target.value)}
                                        placeholder="0"
                                    />
                                    <button className="stepper-btn" onClick={() => step(setReps, reps, 1)}>+</button>
                                </div>
                            </div>
                        )}

                        {exercise.type === 'time_based' && (
                            <div className="set-input-group">
                                <label className="set-input-label">Duration</label>
                                <div className="set-input-value">
                                    <button className="stepper-btn" onClick={() => step(setDuration, duration, -5)}>−</button>
                                    <input
                                        type="number"
                                        value={duration}
                                        onChange={(e) => setDuration(e.target.value)}
                                        placeholder="0"
                                    />
                                    <button className="stepper-btn" onClick={() => step(setDuration, duration, 5)}>+</button>
                                    <span className="set-input-unit">sec</span>
                                </div>
                            </div>
                        )}
                    </div>

                    <button className={`set-complete-btn ${pulsing ? 'completed-pulse' : ''}`} onClick={handleComplete}>
                        {isCompleted ? 'Edit' : 'Complete Set'}
                    </button>
                </div>
            );
        }

        // Month-grid calendar for History. Filled dots mark days with a
        // completed session; outline dots mark days that match a workout's
        // recurring weekday schedule but weren't logged. Tapping a day with
        // a session opens the most recent one from that day.
        function CalendarView({ sessions, plans, onSelectSession }) {
            const [monthDate, setMonthDate] = useState(() => {
                const now = new Date();
                now.setDate(1);
                now.setHours(0, 0, 0, 0);

                // If nothing's logged in the current month, jump straight to
                // whichever month has your most recent workout instead of
                // opening on an empty grid — otherwise the calendar looks
                // broken/empty the first time you check it after a quiet month.
                const loggedThisMonth = sessions.some(s => {
                    const d = new Date(s.completedAt);
                    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
                });
                if (sessions.length === 0 || loggedThisMonth) return now;

                const mostRecent = [...sessions].sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt))[0];
                const target = new Date(mostRecent.completedAt);
                target.setDate(1);
                target.setHours(0, 0, 0, 0);
                return target;
            });

            const scheduledWeekdays = useMemo(() => {
                const days = new Set();
                plans.forEach(plan => plan.workouts.forEach(w => (w.scheduledDays || []).forEach(d => days.add(d))));
                return days;
            }, [plans]);

            const sessionsByDay = useMemo(() => {
                const map = new Map();
                sessions.forEach(s => {
                    const d = new Date(s.completedAt);
                    const key = `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
                    if (!map.has(key)) map.set(key, []);
                    map.get(key).push(s);
                });
                return map;
            }, [sessions]);

            const year = monthDate.getFullYear();
            const month = monthDate.getMonth();
            const firstWeekday = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            const cells = [];
            for (let i = 0; i < firstWeekday; i++) cells.push(null);
            for (let day = 1; day <= daysInMonth; day++) cells.push(day);

            const monthLabel = monthDate.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
            const isCurrentMonth = today.getFullYear() === year && today.getMonth() === month;

            const monthHasAnyMarker = cells.some(day => {
                if (day === null) return false;
                const key = `${year}-${month}-${day}`;
                if (sessionsByDay.has(key)) return true;
                const weekday = new Date(year, month, day).getDay();
                return scheduledWeekdays.has(weekday);
            });

            const handleDayClick = (day) => {
                const key = `${year}-${month}-${day}`;
                const daySessions = sessionsByDay.get(key);
                if (daySessions && daySessions.length > 0) {
                    const mostRecent = [...daySessions].sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt))[0];
                    onSelectSession(mostRecent.id);
                }
            };

            return (
                <div>
                    <div className="calendar-nav">
                        <button
                            className="calendar-nav-btn"
                            onClick={() => setMonthDate(new Date(year, month - 1, 1))}
                            aria-label="Previous month"
                        >
                            ‹
                        </button>
                        <div style={{ textAlign: 'center' }}>
                            <div className="text-h4">{monthLabel}</div>
                            {!isCurrentMonth && (
                                <button
                                    onClick={() => {
                                        const now = new Date();
                                        now.setDate(1);
                                        now.setHours(0, 0, 0, 0);
                                        setMonthDate(now);
                                    }}
                                    style={{ background: 'none', border: 'none', color: 'var(--accent)', fontSize: '12px', cursor: 'pointer', padding: '2px 0' }}
                                >
                                    Jump to Today
                                </button>
                            )}
                        </div>
                        <button
                            className="calendar-nav-btn"
                            onClick={() => setMonthDate(new Date(year, month + 1, 1))}
                            aria-label="Next month"
                        >
                            ›
                        </button>
                    </div>
                    <div className="calendar-grid">
                        {WEEKDAY_LETTERS.map((letter, i) => (
                            <div key={i} className="calendar-day-label">{letter}</div>
                        ))}
                        {cells.map((day, idx) => {
                            if (day === null) {
                                return <div key={idx} className="calendar-cell empty"></div>;
                            }
                            const key = `${year}-${month}-${day}`;
                            const daySessions = sessionsByDay.get(key);
                            const hasSession = !!(daySessions && daySessions.length > 0);
                            const weekday = new Date(year, month, day).getDay();
                            const isScheduled = scheduledWeekdays.has(weekday);
                            const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
                            return (
                                <div
                                    key={idx}
                                    className={`calendar-cell ${isToday ? 'today' : ''} ${hasSession ? 'has-session' : ''}`}
                                    onClick={() => handleDayClick(day)}
                                    style={{ cursor: hasSession ? 'pointer' : 'default' }}
                                >
                                    <div>{day}</div>
                                    {hasSession ? (
                                        <div className="calendar-dot"></div>
                                    ) : isScheduled ? (
                                        <div className="calendar-dot scheduled-only"></div>
                                    ) : (
                                        <div style={{ width: '8px', height: '8px' }}></div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                    <div style={{ display: 'flex', gap: '16px', marginTop: '14px' }}>
                        <div className="text-caption" style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                            <div className="calendar-dot"></div> Completed
                        </div>
                        <div className="text-caption" style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                            <div className="calendar-dot scheduled-only"></div> Scheduled
                        </div>
                    </div>

                    {!monthHasAnyMarker && (
                        <div className="text-caption" style={{ marginTop: '14px', textAlign: 'center' }}>
                            Nothing logged or scheduled for {monthDate.toLocaleDateString(undefined, { month: 'long' })} yet.
                            {sessions.length === 0 && ' Finish a workout, or add scheduled days to a workout, and it\'ll show up here.'}
                        </div>
                    )}
                </div>
            );
        }

        function HistoryScreen({ onNavigate, state }) {
            const [view, setView] = useState('list');
            const sessions = [...state.sessions].sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));

            const handleViewSession = (sessionId) => {
                onNavigate('session-detail', { sessionId });
            };

            return (
                <div className="screen active" style={{ padding: '16px', paddingBottom: '100px' }}>
                    <div className="text-h2" style={{ marginBottom: '16px' }}>History</div>

                    <div className="segmented-control">
                        <button
                            className={`segmented-btn ${view === 'list' ? 'active' : ''}`}
                            onClick={() => setView('list')}
                        >
                            List
                        </button>
                        <button
                            className={`segmented-btn ${view === 'calendar' ? 'active' : ''}`}
                            onClick={() => setView('calendar')}
                        >
                            Calendar
                        </button>
                    </div>

                    {view === 'calendar' ? (
                        <CalendarView
                            sessions={state.sessions}
                            plans={state.plans}
                            onSelectSession={handleViewSession}
                        />
                    ) : sessions.length === 0 ? (
                        <div className="empty-state">
                            <div className="empty-state-icon">📊</div>
                            <div className="empty-state-text">No completed workouts yet.</div>
                        </div>
                    ) : (
                        <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                            {sessions.map(session => (
                                <div
                                    key={session.id}
                                    className="card card-hover"
                                    onClick={() => handleViewSession(session.id)}
                                    style={{ cursor: 'pointer' }}
                                >
                                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px' }}>
                                        <div style={{ flex: 1, minWidth: 0 }}>
                                            <div className="text-h4">{session.workoutName}</div>
                                            <div className="text-caption">
                                                {session.planName}
                                            </div>
                                        </div>
                                        <span style={{ fontSize: '20px', flexShrink: 0 }}>→</span>
                                    </div>
                                    <div className="text-caption">
                                        {new Date(session.completedAt).toLocaleDateString(undefined, {
                                            month: 'short',
                                            day: 'numeric',
                                            year: 'numeric'
                                        })}
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function chartBaseOptions(extra = {}) {
            return {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false },
                    tooltip: {
                        backgroundColor: '#1a1a1a',
                        titleColor: '#ffffff',
                        bodyColor: '#a0a0a0',
                        borderColor: 'rgba(255,255,255,0.08)',
                        borderWidth: 1,
                        padding: 10
                    }
                },
                scales: {
                    x: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#707070', font: { size: 10 }, maxRotation: 0, autoSkip: true }
                    },
                    y: {
                        grid: { color: 'rgba(255,255,255,0.05)' },
                        ticks: { color: '#707070', font: { size: 10 } },
                        beginAtZero: true
                    }
                },
                ...extra
            };
        }

        // Generic hook: creates/destroys a Chart.js instance on a canvas as
        // the underlying config changes. Config is passed as a factory so it
        // isn't rebuilt unless the signature actually changes.
        function useChart(canvasRef, buildConfig, signature) {
            useEffect(() => {
                if (!canvasRef.current || typeof Chart === 'undefined') return;
                const chart = new Chart(canvasRef.current, buildConfig());
                return () => chart.destroy();
                // eslint-disable-next-line
            }, [signature]);
        }

        function VolumeChart({ sessions }) {
            const canvasRef = useRef(null);

            const { labels, data, totalVolume } = useMemo(() => {
                const labels = [];
                const data = [];
                sessions.forEach(s => {
                    let vol = 0;
                    s.exercises.forEach(ex => {
                        if (ex.type !== 'weighted') return;
                        ex.completedSets.forEach(set => {
                            if (set.completed && set.weight != null && set.reps != null) {
                                vol += set.weight * set.reps;
                            }
                        });
                    });
                    labels.push(new Date(s.completedAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
                    data.push(Math.round(vol));
                });
                return { labels, data, totalVolume: data.reduce((a, b) => a + b, 0) };
            }, [sessions]);

            useChart(canvasRef, () => ({
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: 'rgba(0,217,255,0.5)',
                        borderColor: '#00d9ff',
                        borderWidth: 1,
                        borderRadius: 4,
                        maxBarThickness: 28
                    }]
                },
                options: chartBaseOptions()
            }), labels.join(',') + data.join(','));

            if (data.every(v => v === 0)) {
                return (
                    <div className="empty-state">
                        <div className="empty-state-icon">📈</div>
                        <div className="empty-state-text">No weighted-exercise data yet. Volume tracks total kg lifted per workout.</div>
                    </div>
                );
            }

            return (
                <>
                    <div className="chart-card">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                    <div className="text-caption mt-md">
                        Total volume across {sessions.length} workout{sessions.length === 1 ? '' : 's'}: {totalVolume.toLocaleString()} kg
                    </div>
                </>
            );
        }

        function FrequencyChart({ sessions }) {
            const canvasRef = useRef(null);

            const { labels, data } = useMemo(() => {
                // Keyed and labeled entirely from local date components — a
                // toISOString() round-trip here would shift the bucket to
                // the wrong day for anyone east of UTC.
                const weekMap = new Map();
                const mondayDates = new Map();
                sessions.forEach(s => {
                    const d = new Date(s.completedAt);
                    const day = (d.getDay() + 6) % 7; // 0 = Monday
                    const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
                    const key = `${monday.getFullYear()}-${monday.getMonth()}-${monday.getDate()}`;
                    weekMap.set(key, (weekMap.get(key) || 0) + 1);
                    if (!mondayDates.has(key)) mondayDates.set(key, monday);
                });
                const sortedKeys = Array.from(weekMap.keys()).sort((a, b) => mondayDates.get(a) - mondayDates.get(b));
                const recentKeys = sortedKeys.slice(-10);
                const labels = recentKeys.map(k => mondayDates.get(k).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
                const data = recentKeys.map(k => weekMap.get(k));
                return { labels, data };
            }, [sessions]);

            useChart(canvasRef, () => ({
                type: 'bar',
                data: {
                    labels,
                    datasets: [{
                        data,
                        backgroundColor: 'rgba(0,217,255,0.5)',
                        borderColor: '#00d9ff',
                        borderWidth: 1,
                        borderRadius: 4,
                        maxBarThickness: 28
                    }]
                },
                options: chartBaseOptions({
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#707070', font: { size: 10 }, maxRotation: 0 } },
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#707070', font: { size: 10 }, stepSize: 1, precision: 0 }, beginAtZero: true }
                    }
                })
            }), labels.join(',') + data.join(','));

            return (
                <>
                    <div className="chart-card">
                        <canvas ref={canvasRef}></canvas>
                    </div>
                    <div className="text-caption mt-md">Workouts completed per week (last {labels.length} weeks with activity)</div>
                </>
            );
        }

        function ExerciseProgressChart({ sessions, exerciseName }) {
            const canvasRef = useRef(null);

            const points = useMemo(() => {
                const pts = [];
                sessions.forEach(s => {
                    const ex = s.exercises.find(e => e.name === exerciseName);
                    if (!ex) return;
                    let value = null;
                    if (ex.type === 'weighted') {
                        const vals = ex.completedSets.filter(set => set.completed && set.weight != null).map(set => set.weight);
                        if (vals.length) value = Math.max(...vals);
                    } else if (ex.type === 'bodyweight') {
                        const vals = ex.completedSets.filter(set => set.completed && set.reps != null).map(set => set.reps);
                        if (vals.length) value = Math.max(...vals);
                    } else {
                        const vals = ex.completedSets.filter(set => set.completed && set.duration != null).map(set => set.duration);
                        if (vals.length) value = Math.max(...vals);
                    }
                    if (value != null) {
                        pts.push({ date: s.completedAt, value, type: ex.type });
                    }
                });
                return pts;
            }, [sessions, exerciseName]);

            const labels = points.map(p => new Date(p.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
            const data = points.map(p => p.value);
            const unit = points[0] ? (points[0].type === 'weighted' ? 'kg' : points[0].type === 'time_based' ? 'sec' : 'reps') : '';

            useChart(canvasRef, () => ({
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        data,
                        borderColor: '#00d9ff',
                        backgroundColor: 'rgba(0,217,255,0.15)',
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: '#00d9ff',
                        pointRadius: 4,
                        pointHoverRadius: 6
                    }]
                },
                options: chartBaseOptions()
            }), exerciseName + labels.join(',') + data.join(','));

            if (points.length === 0) {
                return (
                    <div className="empty-state">
                        <div className="empty-state-icon">📈</div>
                        <div className="empty-state-text">No history yet for this exercise.</div>
                    </div>
                );
            }

            const best = Math.max(...data);
            const latest = data[data.length - 1];
            const prev = data.length > 1 ? data[data.length - 2] : null;
            const delta = prev != null ? Math.round((latest - prev) * 10) / 10 : null;

            return (
                <>
                    <div className="chart-card" style={{ marginBottom: '16px' }}>
                        <canvas ref={canvasRef}></canvas>
                    </div>
                    <div className="card">
                        <div className="stat-row">
                            <span className="text-caption">Personal best</span>
                            <span className="stat-value">{best} {unit}</span>
                        </div>
                        <div className="stat-row">
                            <span className="text-caption">Most recent</span>
                            <span className="stat-value">{latest} {unit}</span>
                        </div>
                        {delta != null && (
                            <div className="stat-row">
                                <span className="text-caption">Change vs previous</span>
                                <span
                                    className="stat-value"
                                    style={{ color: delta > 0 ? 'var(--success)' : delta < 0 ? 'var(--danger)' : 'var(--text-secondary)' }}
                                >
                                    {delta > 0 ? '+' : ''}{delta} {unit}
                                </span>
                            </div>
                        )}
                    </div>
                </>
            );
        }

        function ProgressScreen({ state }) {
            const [view, setView] = useState('volume');
            const [selectedExercise, setSelectedExercise] = useState('');

            const sessions = useMemo(
                () => [...state.sessions].sort((a, b) => new Date(a.completedAt) - new Date(b.completedAt)),
                [state.sessions]
            );

            const exerciseNames = useMemo(() => {
                const names = new Set();
                sessions.forEach(s => s.exercises.forEach(ex => names.add(ex.name)));
                return Array.from(names).sort();
            }, [sessions]);

            useEffect(() => {
                if (!selectedExercise && exerciseNames.length > 0) {
                    setSelectedExercise(exerciseNames[0]);

        function WorkoutCompleteScreen({ onNavigate, sessionId, state }) {

                );

            let totalSets = 0;
            let completedSets = 0;
            let totalVolume = 0;

            session.exercises.forEach(ex => {
                ex.completedSets.forEach(set => {
                    totalSets += 1;
                    if (set.completed) {
                        completedSets += 1;
                        if (ex.type === 'weighted' && set.weight != null && set.reps != null) {
                            totalVolume += set.weight * set.reps;
                        }
                    }
                });
            });

            const durationMin = Math.max(0, Math.round(
                (new Date(session.completedAt) - new Date(session.startedAt)) / 60000

            // Closing loses everything typed so far, since nothing here is
            // saved until "Create Plan" — worth a confirm once there's
            // actually something to lose.
            const hasUnsavedProgress = planName.trim() !== '' || workouts.length > 0 ||
                currentWorkout.name.trim() !== '' || currentWorkout.exercises.length > 0;

            const handleClose = async () => {
                if (hasUnsavedProgress) {
                    const proceed = await confirmDialog.request({
                        title: 'Discard this plan?',
                        message: 'Nothing has been saved yet — closing now will lose everything you\'ve entered.',
                        confirmLabel: 'Discard',
                        danger: true
                    });

                }
                onClose();

                if (creating || !planName.trim() || workouts.length === 0) return;
                setCreating(true);
                const plan = store.createPlan(planName);
                workouts.forEach(workout => {
                    const w = store.addWorkout(plan.id, workout.name);
                    workout.exercises.forEach(exercise => {
                        store.addExercise(plan.id, w.id, exercise);
                    });
                });
                onClose();

                                    Continue

                                            <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Workout Name</label>
                                            <input
                                                type="text"
                                                className="input-field"
                                                placeholder="e.g., Workout A"
                                                value={currentWorkout.name}
                                                onChange={(e) => setCurrentWorkout({ ...currentWorkout, name: e.target.value })}
                                            />
                                        </div>

                                        <div>
                                            <div className="text-h4" style={{ marginBottom: '4px' }}>Exercises</div>
                                            <div className="text-caption" style={{ marginBottom: '12px' }}>
                                                Optional — leave empty for unstructured workouts like Yoga.
                                            </div>
                                            {currentWorkout.exercises.map((ex, idx) => (
                                                <div key={idx} className="card" style={{ marginBottom: '8px' }}>

                                                            <div className="text-body" style={{ wordBreak: 'break-word' }}>{ex.name}</div>

                                                                {ex.sets}x {ex.reps || ex.duration}

                                                        <button

                                                                setCurrentWorkout({

                                                                onClick={() => {
                                                                    setWorkouts(workouts.filter((_, i) => i !== idx));

            return (

        function ExerciseEditor({ onAdd, onClose, initial }) {
            const [name, setName] = useState(initial?.name || '');
            const [type, setType] = useState(initial?.type || 'weighted');
            const [sets, setSets] = useState(initial?.sets?.toString() || '3');
            const [reps, setReps] = useState(initial?.reps?.toString() || '8');
            const [duration, setDuration] = useState(initial?.duration?.toString() || '30');
            const [weight, setWeight] = useState(initial?.weight?.toString() || '');

            const setsNum = parseInt(sets, 10);
            const repsNum = parseInt(reps, 10);
            const durationNum = parseInt(duration, 10);
            const weightNum = parseFloat(weight);

            const isValid = (() => {
                if (!name.trim()) return false;
                if (!Number.isInteger(setsNum) || setsNum < 1) return false;
                if (type === 'weighted') {
                    return Number.isInteger(repsNum) && repsNum >= 1 && !isNaN(weightNum) && weightNum >= 0;
                }
                if (type === 'bodyweight') {
                    return Number.isInteger(repsNum) && repsNum >= 1;
                }
                return Number.isInteger(durationNum) && durationNum >= 1;
            })();

            const handleAdd = () => {
                if (!isValid) return;
                const exercise = {
                    name: name.trim(),
                    type,
                    sets: setsNum,
                    reps: type === 'weighted' || type === 'bodyweight' ? repsNum : null,
                    duration: type === 'time_based' ? durationNum : null,
                    weight: type === 'weighted' ? weightNum : null
                };
                onAdd(exercise);
            };

            return (
                <>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                        <div>
                            <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Exercise Name</label>
                            <input
                                type="text"
                                className="input-field"
                                placeholder="e.g., Bench Press"
                                value={name}
                                onChange={(e) => setName(e.target.value)}
                                autoFocus
                            />
                        </div>

                        <div>
                            <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Type</label>
                            <select
                                className="input-field"
                                value={type}
                                onChange={(e) => setType(e.target.value)}
                                style={{ appearance: 'none', paddingRight: '32px' }}
                            >
                                <option value="weighted">Weighted</option>
                                <option value="bodyweight">Bodyweight</option>
                                <option value="time_based">Time-based</option>
                            </select>
                        </div>

                        <div>
                            <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Sets</label>
                            <input
                                type="number"
                                className="input-field"
                                value={sets}
                                onChange={(e) => setSets(e.target.value)}
                            />
                        </div>

                        {(type === 'weighted' || type === 'bodyweight') && (
                            <div>
                                <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Target Reps</label>
                                <input
                                    type="number"
                                    className="input-field"
                                    value={reps}
                                    onChange={(e) => setReps(e.target.value)}
                                />
                            </div>
                        )}

                        {type === 'time_based' && (
                            <div>
                                <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Target Duration (seconds)</label>
                                <input
                                    type="number"
                                    className="input-field"
                                    value={duration}
                                    onChange={(e) => setDuration(e.target.value)}
                                />
                            </div>
                        )}

                        {type === 'weighted' && (
                            <div>
                                <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Target Weight (kg)</label>
                                <input
                                    type="number"
                                    step="0.5"
                                    className="input-field"
                                    placeholder="0"
                                    value={weight}
                                    onChange={(e) => setWeight(e.target.value)}
                                />
                            </div>
                        )}

                        <div style={{ display: 'flex', gap: '12px' }}>
                            <button className="btn btn-secondary btn-block" onClick={onClose}>
                                Cancel
                            </button>
                            <button className="btn btn-primary btn-block" onClick={handleAdd} disabled={!isValid}>
                                {initial ? 'Save Changes' : 'Add Exercise'}
                            </button>
                        </div>
                    </div>
                </>
            );
        }

        function EditPlanScreen({ onNavigate, planId, state }) {
            const plan = state.plans.find(p => p.id === planId);
            const [name, setName] = useState(plan?.name || '');
            const [addingWorkout, setAddingWorkout] = useState(false);
            const [newWorkoutName, setNewWorkoutName] = useState('');

            if (!plan) {
                return <div className="screen active" style={{ padding: '20px' }}>Plan not found</div>;
            }

            const handleRenamePlan = () => {
                if (name.trim() && name.trim() !== plan.name) {
                    store.updatePlan(planId, { name: name.trim() });
                }
            };

            const handleAddWorkout = () => {
                if (newWorkoutName.trim()) {
                    store.addWorkout(planId, newWorkoutName.trim());
                    setNewWorkoutName('');
                    setAddingWorkout(false);
                }
            };

            const handleDuplicateWorkout = (workoutId) => {
                store.duplicateWorkout(planId, workoutId);
            };

            const handleDeleteWorkout = async (workoutId, workoutName) => {
                const proceed = await confirmDialog.request({
                    title: 'Delete this workout?',
                    message: `"${workoutName}" and all its exercises will be removed. This cannot be undone.`,
                    confirmLabel: 'Delete',
                    danger: true
                });
                if (proceed) {
                    store.deleteWorkout(planId, workoutId);
                }
            };

            const handleDeletePlan = async () => {
                const proceed = await confirmDialog.request({
                    title: 'Delete this plan?',
                    message: `The entire "${plan.name}" plan and all its workouts will be removed. This cannot be undone.`,
                    confirmLabel: 'Delete',
                    danger: true
                });
                if (proceed) {
                    store.deletePlan(planId);
                    onNavigate('home');
                }
            };

            const handleMoveWorkout = (index, direction) => {
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= plan.workouts.length) return;
                const workouts = [...plan.workouts];
                [workouts[index], workouts[newIndex]] = [workouts[newIndex], workouts[index]];
                store.reorderWorkouts(planId, workouts);
            };

            return (
                <div className="screen active" style={{ padding: '16px', paddingBottom: '100px' }}>
                    <BackButton onClick={() => onNavigate('plan-details', { planId })} />

                    <div className="text-h2" style={{ marginBottom: '16px' }}>Edit Plan</div>

                    <div style={{ marginBottom: '20px' }}>
                        <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Plan Name</label>
                        <input
                            type="text"
                            className="input-field"
                            value={name}
                            onChange={(e) => setName(e.target.value)}
                            onBlur={handleRenamePlan}
                        />
                    </div>

                    <div className="text-h4" style={{ marginBottom: '4px' }}>Workouts</div>
                    <div className="text-caption" style={{ marginBottom: '12px' }}>
                        Use the arrows to change the order workouts appear in.
                    </div>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px', marginBottom: '16px' }}>
                        {plan.workouts.map((workout, idx) => (
                            <div key={workout.id} className="card">
                                <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: '10px', gap: '8px' }}>
                                    <div style={{ flex: 1, minWidth: 0 }}>
                                        <div className="text-body" style={{ fontWeight: 600, wordBreak: 'break-word' }}>{workout.name}</div>
                                        <div className="text-caption">
                                            {workout.exercises.length === 0 ? 'No exercises' : `${workout.exercises.length} exercises`}
                                        </div>
                                        {formatScheduledDays(workout.scheduledDays) && (
                                            <div className="day-badge" style={{ marginTop: '2px' }}>
                                                📅 {formatScheduledDays(workout.scheduledDays)}
                                            </div>
                                        )}
                                    </div>
                                    <div className="icon-toolbar">
                                        <button
                                            className="icon-btn"
                                            onClick={() => handleMoveWorkout(idx, -1)}
                                            disabled={idx === 0}
                                            style={{ opacity: idx === 0 ? 0.35 : 1 }}
                                            aria-label="Move up"
                                            title="Move up"
                                        >
                                            <IconChevronUp />
                                        </button>
                                        <button
                                            className="icon-btn"
                                            onClick={() => handleMoveWorkout(idx, 1)}
                                            disabled={idx === plan.workouts.length - 1}
                                            style={{ opacity: idx === plan.workouts.length - 1 ? 0.35 : 1 }}
                                            aria-label="Move down"
                                            title="Move down"
                                        >
                                            <IconChevronDown />
                                        </button>
                                        <div className="icon-toolbar-divider"></div>
                                        <button
                                            className="icon-btn"
                                            onClick={() => onNavigate('edit-workout', { planId, workoutId: workout.id })}
                                            aria-label="Edit exercises"
                                            title="Edit exercises"
                                        >
                                            <IconPencil />
                                        </button>
                                        <button
                                            className="icon-btn"
                                            onClick={() => handleDuplicateWorkout(workout.id)}
                                            aria-label="Duplicate workout"
                                            title="Duplicate"
                                        >
                                            <IconCopy />
                                        </button>
                                        <button
                                            className="icon-btn danger"
                                            onClick={() => handleDeleteWorkout(workout.id, workout.name)}
                                            aria-label="Delete workout"
                                            title="Delete"
                                        >
                                            <IconTrash />
                                        </button>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                    {addingWorkout ? (
                        <div className="card" style={{ marginBottom: '16px' }}>
                            <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>New Workout Name</label>
                            <input
                                type="text"
                                className="input-field"
                                placeholder="e.g., Workout B"
                                value={newWorkoutName}
                                onChange={(e) => setNewWorkoutName(e.target.value)}
                                autoFocus
                                style={{ marginBottom: '12px' }}
                            />
                            <div style={{ display: 'flex', gap: '12px' }}>
                                <button className="btn btn-secondary btn-block" onClick={() => { setAddingWorkout(false); setNewWorkoutName(''); }}>
                                    Cancel
                                </button>
                                <button className="btn btn-primary btn-block" onClick={handleAddWorkout} disabled={!newWorkoutName.trim()}>
                                    Add
                                </button>
                            </div>
                        </div>
                    ) : (
                        <button className="btn btn-secondary btn-block mb-md" onClick={() => setAddingWorkout(true)}>
                            + Add Workout
                        </button>
                    )}

                    <button className="btn btn-danger btn-block mt-lg" onClick={handleDeletePlan}>
                        <IconTrash size={15} /> Delete Plan
                    </button>
                </div>
            );
        }

        function EditWorkoutScreen({ onNavigate, planId, workoutId, state }) {
            const plan = state.plans.find(p => p.id === planId);
            const workout = plan?.workouts.find(w => w.id === workoutId);
            const [name, setName] = useState(workout?.name || '');
            const [addingExercise, setAddingExercise] = useState(false);
            const [editingExerciseId, setEditingExerciseId] = useState(null);

            if (!plan || !workout) {
                return <div className="screen active" style={{ padding: '20px' }}>Workout not found</div>;
            }

            const handleRenameWorkout = () => {
                if (name.trim() && name.trim() !== workout.name) {
                    store.updateWorkout(planId, workoutId, { name: name.trim() });
                }
            };

            const handleAddExercise = (exercise) => {
                store.addExercise(planId, workoutId, exercise);
                setAddingExercise(false);
            };

            const handleSaveExercise = (exerciseId, updates) => {
                store.updateExercise(planId, workoutId, exerciseId, updates);
                setEditingExerciseId(null);
            };

            const handleDeleteExercise = async (exerciseId, exerciseName) => {
                const proceed = await confirmDialog.request({
                    title: 'Delete this exercise?',
                    message: `"${exerciseName}" will be removed from this workout. This cannot be undone.`,
                    confirmLabel: 'Delete',
                    danger: true
                });
                if (proceed) {
                    store.deleteExercise(planId, workoutId, exerciseId);
                }
            };

            const handleMoveExercise = (index, direction) => {
                const newIndex = index + direction;
                if (newIndex < 0 || newIndex >= workout.exercises.length) return;
                const exercises = [...workout.exercises];
                [exercises[index], exercises[newIndex]] = [exercises[newIndex], exercises[index]];
                store.reorderExercises(planId, workoutId, exercises);
            };

            const handleLinkSuperset = (exerciseId) => {
                store.linkSupersetWithNext(planId, workoutId, exerciseId);
            };

            const handleUnlinkSuperset = (exerciseId) => {
                store.unlinkSuperset(planId, workoutId, exerciseId);
            };

            const handleToggleDay = (day) => {
                const current = workout.scheduledDays || [];
                const next = current.includes(day)
                    ? current.filter(d => d !== day)
                    : [...current, day].sort();
                store.updateWorkout(planId, workoutId, { scheduledDays: next });
            };

            const editingExercise = editingExerciseId ? workout.exercises.find(e => e.id === editingExerciseId) : null;

            return (
                <div className="screen active" style={{ padding: '16px', paddingBottom: '100px' }}>
                    <BackButton onClick={() => onNavigate('edit-plan', { planId })} />

                    <div className="text-h2" style={{ marginBottom: '16px' }}>Edit Workout</div>

                    <div style={{ marginBottom: '20px' }}>
                        <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>Workout Name</label>
                        <input
                            type="text"
                            className="input-field"
                            value={name}
                            onChange={(e) => setName(e.target.value)}
                            onBlur={handleRenameWorkout}
                        />
                    </div>

                    <div style={{ marginBottom: '20px' }}>
                        <label className="text-caption" style={{ display: 'block', marginBottom: '8px' }}>
                            Scheduled Days (optional)
                        </label>
                        <DayOfWeekPicker
                            selectedDays={workout.scheduledDays || []}
                            onToggle={handleToggleDay}
                        />
                    </div>

                    <div className="text-h4" style={{ marginBottom: '4px' }}>Exercises</div>
                    <div className="text-caption" style={{ marginBottom: '12px' }}>
                        Reorder with the arrows. Link two adjacent exercises as a superset to perform them back-to-back. This workout can also have no exercises.
                    </div>

                    {addingExercise ? (
                        <div className="card" style={{ marginBottom: '16px' }}>
                            <ExerciseEditor
                                onAdd={handleAddExercise}
                                onClose={() => setAddingExercise(false)}
                            />
                        </div>
                    ) : editingExercise ? (
                        <div className="card" style={{ marginBottom: '16px' }}>
                            <ExerciseEditor
                                initial={editingExercise}
                                onAdd={(updates) => handleSaveExercise(editingExercise.id, updates)}
                                onClose={() => setEditingExerciseId(null)}
                            />
                        </div>
                    ) : (
                        <>
                            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px', marginBottom: '16px' }}>
                                {workout.exercises.map((ex, idx) => {
                                    const nextEx = workout.exercises[idx + 1];
                                    const partner = getSupersetPartner(workout.exercises, ex);
                                    const linkedWithNext = partner && nextEx && partner.id === nextEx.id;
                                    const canLinkWithNext = !ex.supersetId && nextEx && !nextEx.supersetId;

                                    return (
                                        <div
                                            key={ex.id}
                                            className="card"
                                            style={ex.supersetId ? { borderLeft: '3px solid var(--accent)' } : undefined}
                                        >
                                            {ex.supersetId && (
                                                <div className="text-caption" style={{ color: 'var(--accent)', fontWeight: 600, marginBottom: '6px' }}>
                                                    🔗 SUPERSET — with {partner?.name}
                                                </div>
                                            )}
                                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '10px', gap: '8px' }}>
                                                <div style={{ flex: 1, minWidth: 0 }}>
                                                    <div className="text-body" style={{ fontWeight: 600, wordBreak: 'break-word' }}>{ex.name}</div>
                                                    <div className="text-caption">
                                                        {ex.sets} sets
                                                        {ex.type === 'weighted' && ` × ${ex.reps} reps @ ${ex.weight}kg`}
                                                        {ex.type === 'bodyweight' && ` × ${ex.reps} reps`}
                                                        {ex.type === 'time_based' && ` × ${ex.duration}s`}
                                                    </div>
                                                </div>
                                                <div className="icon-toolbar">
                                                    <button
                                                        className="icon-btn"
                                                        onClick={() => handleMoveExercise(idx, -1)}
                                                        disabled={idx === 0}
                                                        style={{ opacity: idx === 0 ? 0.35 : 1 }}
                                                        aria-label="Move up"
                                                        title="Move up"
                                                    >
                                                        <IconChevronUp />
                                                    </button>
                                                    <button
                                                        className="icon-btn"
                                                        onClick={() => handleMoveExercise(idx, 1)}
                                                        disabled={idx === workout.exercises.length - 1}
                                                        style={{ opacity: idx === workout.exercises.length - 1 ? 0.35 : 1 }}
                                                        aria-label="Move down"
                                                        title="Move down"
                                                    >
                                                        <IconChevronDown />
                                                    </button>
                                                    <div className="icon-toolbar-divider"></div>
                                                    <button
                                                        className="icon-btn"
                                                        onClick={() => setEditingExerciseId(ex.id)}
                                                        aria-label="Edit exercise"
                                                        title="Edit"
                                                    >
                                                        <IconPencil />
                                                    </button>
                                                    <button
                                                        className="icon-btn danger"
                                                        onClick={() => handleDeleteExercise(ex.id, ex.name)}
                                                        aria-label="Delete exercise"
                                                        title="Delete"
                                                    >
                                                        <IconTrash />
                                                    </button>
                                                </div>
                                            </div>
                                            {linkedWithNext && (
                                                <button
                                                    className="btn btn-secondary btn-sm btn-block"
                                                    onClick={() => handleUnlinkSuperset(ex.id)}
                                                >
                                                    Unlink Superset
                                                </button>
                                            )}
                                            {canLinkWithNext && (
                                                <button
                                                    className="btn btn-secondary btn-sm btn-block"
                                                    onClick={() => handleLinkSuperset(ex.id)}
                                                >
                                                    🔗 Link as Superset with "{nextEx.name}"
                                                </button>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>

                            <button className="btn btn-secondary btn-block" onClick={() => setAddingExercise(true)}>
                                + Add Exercise
                            </button>
                        </>
                    )}
                </div>
            );
        }

        // Main App Component
        function App() {
            const state = useStore();
            const { currentScreen, setCurrentScreen } = useNavigation();
            const [screenParams, setScreenParams] = useState({});

            const handleNavigate = (screen, params = {}) => {
                setCurrentScreen(screen);
                setScreenParams(params);
            };

            const getGreeting = () => {
                const hour = new Date().getHours();
                if (hour < 12) return 'Home';
                if (hour < 17) return 'Home';
                return 'Home';
            };

            const currentSessionExists = !!state.currentSession;

            return (
                <div className="app-container">
                    <div className="app-content">
                        {currentScreen === 'home' && (
                            <HomeScreen onNavigate={handleNavigate} state={state} />
                        )}

                        {currentScreen === 'plan-details' && (
                            <PlanDetailsScreen
                                onNavigate={handleNavigate}
                                planId={screenParams.planId}
                                state={state}
                            />
                        )}

                        {currentScreen === 'edit-plan' && (
                            <EditPlanScreen
                                onNavigate={handleNavigate}
                                planId={screenParams.planId}
                                state={state}
                            />
                        )}

                        {currentScreen === 'edit-workout' && (
                            <EditWorkoutScreen
                                onNavigate={handleNavigate}
                                planId={screenParams.planId}
                                workoutId={screenParams.workoutId}
                                state={state}
                            />
                        )}

                        {currentScreen === 'workout' && (
                            <WorkoutSessionScreen
                                onNavigate={handleNavigate}
                                state={state}
                            />
                        )}

                        {currentScreen === 'history' && (
                            <HistoryScreen onNavigate={handleNavigate} state={state} />
                        )}

                        {currentScreen === 'progress' && (
                            <ProgressScreen state={state} />
                        )}

                        {currentScreen === 'session-detail' && (
                            <SessionDetailScreen
                                onNavigate={handleNavigate}
                                sessionId={screenParams.sessionId}
                                returnTo={screenParams.returnTo}
                                returnParams={screenParams.returnParams}
                                state={state}
                            />
                        )}

                        {currentScreen === 'workout-complete' && (
                            <WorkoutCompleteScreen
                                onNavigate={handleNavigate}
                                sessionId={screenParams.sessionId}
                                state={state}
                            />
                        )}

                        {currentScreen === 'create-plan' && (
                            <CreatePlanModal
                                onClose={() => handleNavigate('home')}
                                store={store}
                            />
                        )}
                    </div>

                    <div className="app-nav">
                        <button
                            className={`nav-item ${currentScreen === 'home' ? 'active' : ''}`}
                            onClick={() => handleNavigate('home')}
                        >
                            <div className="nav-item-icon"><IconHome /></div>
                            <div>Home</div>
                        </button>
                        <button
                            className={`nav-item ${currentScreen === 'progress' ? 'active' : ''}`}
                            onClick={() => handleNavigate('progress')}
                        >
                            <div className="nav-item-icon"><IconChartLine /></div>
                            <div>Progress</div>
                        </button>
                        <button
                            className={`nav-item ${currentScreen === 'history' ? 'active' : ''}`}
                            onClick={() => handleNavigate('history')}
                        >
                            <div className="nav-item-icon"><IconClipboardList /></div>
                            <div>History</div>
                        </button>
                        {currentSessionExists && (
                            <button
                                className={`nav-item ${currentScreen === 'workout' ? 'active' : ''}`}
                                onClick={() => handleNavigate('workout')}
                                style={{ color: 'var(--success)' }}
                            >
                                <div className="nav-item-icon"><IconTimer /></div>
                                <div>Workout</div>
                            </button>
                        )}
                    </div>

                    <GlobalConfirmModal />
                </div>
            );
        }

        // Render app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        // Register service worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {
                // Service worker not available or failed
            });
        }
    </script>
</body>
</html>
